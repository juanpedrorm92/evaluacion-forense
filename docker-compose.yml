services:
  app:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CONTACT_API_URL=http://contact-api:3000
    depends_on:
      - contact-api
    stdin_open: true
    tty: true

  contact-api:
    build:
      context: ./services/contact-api
    container_name: evaluaciones-contact-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
    ports:
      - "3000:3000"
    networks:
      - default
      - web

  # Uso: docker compose --profile prod up -d --build app-prod contact-api
  app-prod:
    profiles: ["prod"]
    build:
      context: .
      target: production
    container_name: evaluaciones-app
    restart: unless-stopped
    depends_on:
      - contact-api
    networks:
      - web

networks:
  web:
    name: web

volumes:
  node_modules:
