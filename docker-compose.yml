services:
  app:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  # Uso: docker compose --profile prod up --build app-prod
  # Requiere: docker network create web
  app-prod:
    profiles: ["prod"]
    build:
      context: .
      target: production
    container_name: evaluaciones-app
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true

volumes:
  node_modules:
