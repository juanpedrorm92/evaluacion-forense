services:
  app:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  # Uso: docker compose --profile prod up --build app-prod
  app-prod:
    profiles: ["prod"]
    build:
      context: .
      target: production
    ports:
      - "8080:80"

volumes:
  node_modules:
